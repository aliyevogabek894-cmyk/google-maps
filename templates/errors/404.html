{% extends "base.html" %}
{% block title %}Sahifa topilmadi (404) — {{ site_settings.short_name }}{% endblock %}
{% block content %}
<section class="section">
  <div class="container">
    <div class="card card-gold-top" style="max-width: 640px; margin: 20px auto; text-align: center;">
      <span class="badge badge-gold">404</span>
      <h1 style="margin-top: 10px;">So‘ralgan sahifa topilmadi</h1>

      <div style="display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:16px;">
        <a href="{% url 'core:home' %}" class="btn btn-primary">Bosh sahifaga qaytish</a>
        <a href="{% url 'core:contact' %}" class="btn btn-outline">Aloqa sahifasi</a>
      </div>
    </div>
  </div>
</section>
