{% extends "base.html" %}
{% block title %}Maxfiylik siyosati — {{ site_settings.school_name }}{% endblock %}

{% block content %}
<section class="page-banner">
  <div class="container">
    <h1>Maxfiylik siyosati</h1>
    <p>Siyosat versiyasi: {{ site_settings.privacy_policy_version }}</p>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="card" style="max-width: 860px; margin: 0 auto;">
      <p>{{ site_settings.privacy_policy_text|linebreaksbr }}</p>
    </div>
  </div>
</section>
{% endblock %}
